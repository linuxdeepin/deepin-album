name: 窗口操作_suite
app: deepin-album
description: ''
module: 窗口操作
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: deepin-album
  wait: 3.0
suites:
- id: suite_window_ops_s1
  name: 窗口操作查看照片
  description: 窗口操作双击查看/图片放大
  tags: []
  steps:
  - action: mouse_double_click
    selector:
      name: GridView
      role: list
      child_index: '0'
  assert_steps:
  - action: assert_element
    selector:
      name: NavigationCloseButton
      role: push button
- id: suite_rename_s1
  name: 图片重命名
  description: 读写图片重命名
  tags: []
  steps:
  - action: element_action
    selector:
      name: GridView
      role: list
      child_index: '0'
    do: click
  - action: keyboard_press
    key: f2
  assert_steps:
  - action: assert_element
    selector:
      name: GridView
      role: list
teardown:
- action: session_stop
