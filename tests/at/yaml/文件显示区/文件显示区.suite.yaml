name: 文件显示区_suite
app: deepin-album
description: ''
module: 文件显示区
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: deepin-album
  wait: 3.0
suites:
- id: suite_display_zoom_s1
  name: 缩略图缩放
  description: 缩放条与快捷键调整缩略图大小
  tags: []
  steps:
  - action: keyboard_hot_key
    key: ctrl++
  - action: element_action
    selector:
      name: ThumbnailSizeSlider
      role: slider
    do: click
  assert_steps:
  - action: assert_element
    selector:
      name: ZoomRatioButton
      role: push button
  - action: assert_element
    selector:
      name: ThumbnailSizeSlider
      role: slider
- id: suite_display_select_deselect_s1
  name: 文件选择取消选择
  description: 选择文件与取消选择
  tags: []
  steps:
  - action: mouse_click
    selector:
      name: GridView
      role: list
      child_index: '0'
  - action: keyboard_press
    key: escape
  assert_steps:
  - action: assert_element
    selector:
      name: StatusLabel
      role: label
  - action: assert_element
    selector:
      name: GridView
      role: list
- id: suite_display_favorite_s1
  name: 缩略图收藏
  description: 缩略图收藏/取消收藏
  tags: []
  steps:
  - action: element_action
    selector:
      name: GridView
      role: list
      child_index: '0'
    do: click
  - action: element_action
    selector:
      name: FavoriteButton
      role: push button
    do: click
  assert_steps:
  - action: assert_element
    selector:
      name: 我的收藏
      role: label
- id: suite_display_preview_nav_s1
  name: 预览照片浏览
  description: 预览界面浏览照片
  tags: []
  steps:
  - action: mouse_double_click
    selector:
      name: GridView
      role: list
      child_index: '0'
  - action: keyboard_press
    key: page_down
  assert_steps:
  - action: assert_element
    selector:
      name: MultiImageView
      role: list
- id: suite_display_video_time_s1
  name: 视频时长显示
  description: 视频时长显示检查
  tags: []
  steps:
  - action: mouse_click
    selector:
      name: GridView
      role: list
      child_index: '0'
  assert_steps:
  - action: assert_element
    selector:
      name: GridView
      role: list
teardown:
- action: session_stop
