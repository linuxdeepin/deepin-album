name: 标题栏_suite
app: deepin-album
description: ''
module: 标题栏
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: deepin-album
  wait: 3.0
suites:
- id: suite_titlebar_import_s1
  name: 标题栏导入照片视频
  description: 标题栏导入按钮导入照片和视频
  tags: []
  steps:
  - action: element_action
    selector:
      name: ImportButton
      role: push button
    do: click
  assert_steps:
  - action: assert_element
    selector:
      name: GridView
      role: list
- id: suite_titlebar_close_s1
  name: 窗口关闭按钮退出
  description: 点击关闭按钮退出相册
  tags: []
  steps:
  - action: keyboard_hot_key
    key: ctrl+q
  assert_steps:
  - action: assert_process_not_running
    app: deepin-album
- id: suite_titlebar_favorite_rotate_s1
  name: 标题栏收藏与旋转
  description: 标题栏收藏按钮和旋转按钮
  tags: []
  steps:
  - action: mouse_click
    selector:
      name: GridView
      role: list
      child_index: '0'
  - action: element_action
    selector:
      name: FavoriteButton
      role: push button
    do: click
  - action: element_action
    selector:
      name: RotateButton
      role: push button
    do: click
  assert_steps:
  - action: assert_element
    selector:
      name: 我的收藏
      role: label
  - action: assert_element
    selector:
      name: GridView
      role: list
teardown:
- action: session_stop
