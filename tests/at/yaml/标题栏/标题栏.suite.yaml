name: 标题栏_suite
app: deepin-album
description: ''
module: 标题栏
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: deepin-album
  wait: 3.0
suites:
- id: suite_album_标题栏_s1
  name: 标题栏功能测试
  description: ''
  tags: []
  steps:
  - action: element_action
    selector:
      name: ImportButton
      role: push button
    do: click
  - action: keyboard_hot_key
    key: alt+f4
  - action: mouse_click
    selector:
      name: GridView
      role: list
      child_index: 0
  - action: element_action
    selector:
      name: FavoriteButton
      role: push button
    do: click
  - action: element_action
    selector:
      name: RotateButton
      role: push button
    do: click
  assert_steps:
  - action: assert_window
  - action: assert_element
    selector:
      name: GridView
      role: list
  - action: assert_window_count
    expected: 1
  - action: assert_element
    selector:
      name: GridView
      role: list
  - action: assert_element
    selector:
      name: RotateButton
      role: push button
teardown:
- action: session_stop
