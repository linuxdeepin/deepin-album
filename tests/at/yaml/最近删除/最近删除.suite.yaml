name: 最近删除_suite
app: deepin-album
description: ''
module: 最近删除
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: deepin-album
  wait: 3.0
suites:
- id: suite_recent_restore_s1
  name: 最近删除恢复文件
  description: 最近删除恢复按钮恢复文件
  tags: []
  steps:
  - action: element_action
    selector:
      name: 最近删除
      role: label
    do: click
  - action: element_action
    selector:
      name: RestoreSelectedBtn
      role: push button
    do: click
  assert_steps:
  - action: assert_element
    selector:
      name: GridView
      role: list
- id: suite_recent_delete_s1
  name: 最近删除永久删除
  description: 最近删除视图永久删除文件
  tags: []
  steps:
  - action: element_action
    selector:
      name: 最近删除
      role: label
    do: click
  - action: element_action
    selector:
      name: DeleteButton
      role: push button
    do: click
  - action: element_action
    selector:
      name: DeleteConfirmButton
      role: push button
    do: click
  assert_steps:
  - action: assert_element
    selector:
      name: GridView
      role: list
teardown:
- action: session_stop
