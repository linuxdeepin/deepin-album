    测试界面: 主窗口
    测试功能: 相册基本功能验证
    前置条件: 应用已启动
    AT元素引用:
    - ToggleSidebarButton
    - ImportButton
  steps: []
- id: suite_album_打开关闭
  name: 打开关闭功能测试
  module: 打开关闭
  status: unsupported
  reason: 该用例涉及玲珑命令行启动（ll-cli run / deepin-album 终端命令）以及桌面环境操作（启动器右键发送至任务栏/桌面、双击/右键任务栏与桌面图标），超出 deepin-album 应用 AT-SPI 树范围，无法通过 AT-SPI GUI 自动化表达
