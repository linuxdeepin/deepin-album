cases:
- id: suite_album_基础
  name: 基础功能测试
  module: 基础
  status: unsupported
  reason: 该用例全部步骤为玲珑命令行 ll-cli 终端操作（uninstall/info/upgrade/run/install 卸载、信息查询、升级、运行、安装），属于终端命令类操作，无法通过 AT-SPI GUI 自动化表达
