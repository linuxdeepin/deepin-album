- id: suite_0106
  name: 右键菜单-导出-导出窗口-照片质量
  module: 导出(#115607)
  status: active
  annotation:
    测试界面: 导出(#115607)
    测试功能: 右键菜单-导出-导出窗口-照片质量
    前置条件: 应用已启动，照片/视频已导入
    AT元素引用:
    - AlbumIcon
    - ImportButton
  steps:
  - step_type: action
    action: session_start
    command: deepin-album
    description: 1. 打开相册，右键点击一张照片，点击导出选项
  - step_type: action
    action: element_action
    selector:
      name: ImportButton
      role: push button
    do: click
    description: 2. 修改照片质量为100%，点击保存
  - step_type: action
    action: element_action
    selector:
      name: ImportButton
      role: push button
    do: click
    description: 3. 修改照片质量为50%，点击保存
  - step_type: action
    action: element_action
    selector:
      name: ImportButton
      role: push button
    do: click
    description: 4. 修改照片质量为1%，点击保存
  - step_type: assert
    action: assert_window
    do: window_exists
    description: 5. 选择导出格式为jpeg,jpg,png,bmp后，查看照片质量选项
  - step_type: assert
    action: assert_window
    do: window_exists
    description: 6. 选择导出格式为xbm,xpm,pgm后，查看照片质量选项
  - step_type: assert
    action: assert_window
    do: window_exists
    description: 7. 选择导出格式为xbm,xpm,pgm中的格式后，再选择格式为jpeg,jpg,png,bmp中的格式，查看照片质量选项
  - step_type: assert
    action: assert_window
    do: window_exists
    description: 1. 弹出导出窗口，默认导出照片质量为100%
  - step_type: assert
    action: assert_window
    do: window_exists
    description: 2. 照片导出成功，查看导出的照片，照片质量与原照片一致
  - step_type: assert
    action: assert_window
    do: window_exists
    description: 3. 照片导出成功，查看导出的照片，照片质量较差
  - step_type: assert
    action: assert_window
    do: window_exists
    description: 4. 照片导出成功，查看导出的照片，照片质量较模糊
  - step_type: assert
    action: assert_window
    do: window_exists
    description: 5. 可以修改照片质量
  - step_type: assert
    action: assert_window
    do: window_exists
    description: 6. 无法修改照片质量
  - step_type: assert
    action: assert_window
    do: window_exists
    description: 7. 可以修改照片质量
  - step_type: assert
    action: assert_element
    selector:
      name: AlbumIcon
      role: panel
    description: 验证相册主界面正常显示
