- id: suite_album_标题栏
  name: 标题栏功能测试
  module: 标题栏
  status: active
  reason: ''
  annotation:
    测试界面: 标题栏
    测试功能: 标题栏按钮操作
    前置条件: 应用已启动
    AT元素引用:
    - ToggleSidebarButton
    - ZoomRatioButton
    - ImportButton
    - FavoriteButton
    - RotateButton
    - DeleteButton
  steps:
  - step_type: action
    description: 1. 启动相册
    action: session_start
    command: deepin-album
  - step_type: action
    description: 2. 点击标题栏全局导入按钮
    action: element_action
    selector:
      name: ImportButton
      role: push button
    do: click
  - step_type: assert
    description: 2. 显示文件管理导入弹窗
    action: assert_window
  - step_type: assert
    description: 3. 相册提示导入成功，且当前视图显示当前导入视频
    action: assert_element
    selector:
      name: GridView
      role: list
  - step_type: action
    description: 2. 点击界面右上角的“X”按钮
    action: keyboard_hot_key
    key: alt+f4
  - step_type: assert
    description: 2. 相册成功退出
    action: assert_window_count
    app: deepin-album
    expected: 0
  - step_type: action
    description: 1. 选择任意文件
    action: mouse_click
    selector:
      name: GridView
      role: list
      child_index: 0
  - step_type: action
    description: 2. 点击标题栏的【收藏】
    action: element_action
    selector:
      name: FavoriteButton
      role: push button
    do: click
  - step_type: assert
    description: 3. 我的收藏中有收藏的文件
    action: assert_element
    selector:
      name: GridView
      role: list
  - step_type: action
    description: 2. 点击标题栏的【旋转】
    action: element_action
    selector:
      name: RotateButton
      role: push button
    do: click
  - step_type: assert
    description: 1. 标题栏显示图片操作按钮
    action: assert_element
    selector:
      name: RotateButton
      role: push button
