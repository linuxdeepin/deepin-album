- id: suite_0313
  name: '[core]设备-图片加载提示框'
  module: 设备(#115573)
  status: active
  annotation:
    测试界面: 设备(#115573)
    测试功能: '[core]设备-图片加载提示框'
    前置条件: 应用已启动，照片/视频已导入
    AT元素引用:
    - CancelButton
    - ImportButton
    - NavigationCloseButton
  steps:
  - step_type: action
    action: session_start
    command: deepin-album
    description: 1. 打开相册
  - step_type: assert
    action: assert_window
    do: window_exists
    description: 2. 连接移动设备，成功挂载后，点击进入查看移动设备相册
  - step_type: action
    action: element_action
    selector:
      name: ImportButton
      role: push button
    do: click
    description: 3. 弹出加载提示框后，点击忽略
  - step_type: action
    action: element_action
    selector:
      name: CancelButton
      role: push button
    do: click
    description: 4. 弹出加载提示框后，点击取消
  - step_type: assert
    action: assert_window
    do: window_exists
    description: '1.'
  - step_type: assert
    action: assert_window
    do: window_exists
    description: 2. 弹出正在加载提示信息，固定2秒展示“正在加载图片，请稍候...”。
  - step_type: assert
    action: assert_element
    selector:
      name: NavigationCloseButton
      role: push button
    description: 没有人为操作,   提示框至少显示2秒。2秒到了加载结束就自动退出提示框，如果还没结束就继续显示；人为操作的话,    关闭的时候如果加载完了就直接显示..
      如果关闭的时候还没加载完, 页面继续加载图片直至完成
  - step_type: assert
    action: assert_window
    do: window_exists
    description: 3. 图片继续加载，弹框消失，且点击其他页面再返回移动设备相册时，弹框不会再次出现
  - step_type: assert
    action: assert_element
    selector:
      name: ImportButton
      role: push button
    description: 4. 图片停止加载，弹框消失，已加载完成的图片可以正常导入
