- id: suite_0007
  name: 删除-删除大量照片和视频
  module: 删除(#115611)
  status: active
  annotation:
    测试界面: 删除(#115611)
    测试功能: 删除-删除大量照片和视频
    前置条件: 应用已启动，照片/视频已导入
    AT元素引用:
    - AllCollectionViewButton
    - DeleteButton
    - ImportButton
    - ImportPhotosButton
  steps:
  - step_type: action
    action: session_start
    command: deepin-album
    description: 1. 启动相册
  - step_type: action
    action: element_action
    selector:
      name: ImportButton
      role: push button
    do: click
    description: 2. 点击标题栏【+】
  - step_type: action
    action: element_action
    selector:
      name: ImportPhotosButton
      role: push button
    do: click
    description: 3. 选择本地有读写权限照片和视频，点击【打开】
  - step_type: action
    action: element_action
    selector:
      name: ImportButton
      role: push button
    do: click
    description: 4. 点击侧边栏的【已导入】
  - step_type: action
    action: keyboard_press
    key: Delete
    description: 5. ctrl+a选择所有文件，使用快捷键delete删除
  - step_type: action
    action: element_action
    selector:
      name: DeleteButton
      role: push button
    do: click
    description: 6. 点击照片库【最近删除】
  - step_type: assert
    action: assert_window
    do: window_exists
    description: 1. 显示相册窗口
  - step_type: assert
    action: assert_window
    do: window_exists
    description: 2. 显示文件选择框
  - step_type: assert
    action: assert_element
    selector:
      name: ImportButton
      role: push button
    description: 3. 相册提示导入成功
  - step_type: assert
    action: assert_element
    selector:
      name: ImportButton
      role: push button
    description: 4. 进入已导入视图
  - step_type: assert
    action: assert_element
    selector:
      name: DeleteButton
      role: push button
    description: 5. 删除的照片和视频从相册中移除
  - step_type: assert
    action: assert_element
    selector:
      name: AllCollectionViewButton
      role: push button
    description: 6. 进入“最近删除视图”，且最近删除显示删除的所有照片视频
