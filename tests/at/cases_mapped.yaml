- id: suite_album_文件右键菜单_1
  name: 文件右键菜单功能测试(1)
  module: 文件右键菜单
  status: active
  reason: ''
  annotation:
    测试界面: 文件显示区右键菜单
    测试功能: 文件右键菜单操作
    前置条件: 应用已启动
    AT元素引用:
    - ThumbnailMenu
    - AddToAlbum
    - GridView
    - DeleteButton
  steps:
  - step_type: action
    description: 1. 启动相册
    action: session_start
    command: deepin-album
  - step_type: assert
    description: 1. 正常显示相册窗口
    action: assert_element
    selector:
      name: GridView
      role: list
  - step_type: action
    description: 2. 合集视图选择照片右键点击
    action: dtk_context_menu
    selector:
      name: GridView
    items:
    - 添加到相册
  - step_type: assert
    description: 3. “添加到相册”选项二级菜单显示无自动导入相册的选项
    action: assert_ocr_exists
    value: 添加到相册
  - step_type: action
    description: 2. 点击标题栏【主菜单】，选择【从文件夹导入】选项
    action: dtk_main_menu
    items:
    - 从文件夹导入
  - step_type: action
    description: 3. 选择空文件夹，点击【打开】
    action: keyboard_press
    key: Return
  - step_type: action
    description: 4. 右键点击单个照片
    action: dtk_context_menu
    selector:
      name: GridView
    items:
    - 删除
  - step_type: action
    description: 1. 分别在所有照片、时间线、已导入、我的收藏、自定义相册执行步骤2、3
    action: mouse_right_click
    selector:
      name: GridView
      role: list
  - step_type: action
    description: 3. 选择“删除”
    action: dtk_context_menu
    selector:
      name: GridView
    items:
    - 删除
  - step_type: assert
    description: 4. 确认弹窗选择确认
    action: element_action
    selector:
      name: DeleteButton
      role: push button
    do: click
  - step_type: assert
    description: 5. 查看相册最近删除中是否有删除的视频
    action: assert_element
    selector:
      name: GridView
      role: list
  - step_type: action
    description: 2. 相册中右键点击多个视频
    action: mouse_right_click
    selector:
      name: GridView
      role: list
  - step_type: action
    description: 3. 选择“复制”
    action: dtk_context_menu
    selector:
      name: GridView
    items:
    - 复制
  - step_type: assert
    description: 3. 复制能正常响应
    action: assert_element
    selector:
      name: GridView
      role: list
  - step_type: action
    description: 3. 选择“视频信息”
    action: dtk_context_menu
    selector:
      name: GridView
    items:
    - 视频信息
  - step_type: assert
    description: 3. 相册界面右侧弹窗显示当前视频的信息
    action: assert_element
    selector:
      name: GridView
      role: list
  - step_type: action
    description: 3. 选择“在文件管理器中显示”
    action: dtk_context_menu
    selector:
      name: GridView
    items:
    - 在文件管理器中显示
  - step_type: action
    description: 3. 选择“收藏”
    action: dtk_context_menu
    selector:
      name: GridView
    items:
    - 收藏
  - step_type: assert
    description: 3. 收藏选项正常响应,且我的收藏中有收藏的视频
    action: assert_element
    selector:
      name: GridView
      role: list
  - step_type: action
    description: 3. 选择“添加到相册”
    action: dtk_context_menu
    selector:
      name: GridView
    items:
    - 添加到相册
    - 新建相册
  - step_type: assert
    description: 4. 提示成功添加到“xxx”
    action: assert_ocr_exists
    value: 成功添加
