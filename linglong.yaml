version: '1'

package:
  id: org.deepin.album
  name: deepin-album
  version: 6.0.68.1
  kind: app
  description: |
    album for deepin os.

command:
  - deepin-album

base: org.deepin.base/25.2.2
runtime: org.deepin.runtime.webengine/6.7.0

build: |
  VERSION=$(head -1 debian/changelog | awk -F'[()]' '{print $2}')
  # Qt6/Dtk6 development files (headers + CMake configs) live in the
  # runtime layer, which ll-builder mounts at /runtime in the build
  # container; point CMake at it so find_package resolves deterministically.
  cmake -B build \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_PREFIX_PATH=/runtime \
        -DCMAKE_INSTALL_PREFIX=${PREFIX} \
        -DCMAKE_INSTALL_LIBDIR=${PREFIX}/lib/${TRIPLET} \
        -DVERSION=${VERSION}
  cmake --build build -j`nproc`
  cmake --build build --target install
  # libblas3/liblapack3 ship top-level soname symlinks pointing to
  # /etc/alternatives, which is absent in the container, so
  # libffmpegthumbnailer -> libsphinxbase -> libblas/liblapack fails to load.
  # The real libs live in the blas/ and lapack/ subdirs; add them to the
  # loader path via files/etc/ld.so.conf, which the linyaps-generated
  # zz_deepin-linglong-app.conf includes for this app.
  mkdir -p ${PREFIX}/etc
  printf '%s\n' \
    "${PREFIX}/lib/${TRIPLET}/blas" \
    "${PREFIX}/lib/${TRIPLET}/lapack" \
    > ${PREFIX}/etc/ld.so.conf
  # MovieService resolves libavformat/libavutil/libffmpegthumbnailer through
  # unversioned "*.so" names. Only versioned sonames exist in the container,
  # and ldconfig only indexes unversioned names when they are symlinks, so
  # copy the versioned libs in and add unversioned symlinks next to them.
  mkdir -p ${PREFIX}/lib/${TRIPLET}
  for LIB in libffmpegthumbnailer libavformat libavutil; do
    for VERSIONED in /usr/lib/${TRIPLET}/${LIB}.so.*; do
      if [ -f "${VERSIONED}" ]; then
        SONAME=${VERSIONED##*/}
        cp -L ${VERSIONED} ${PREFIX}/lib/${TRIPLET}/${SONAME}
        ln -sf ${SONAME} ${PREFIX}/lib/${TRIPLET}/${LIB}.so
        break
      fi
    done
  done

buildext:
  apt:
    build_depends:
      - cmake
      - pkg-config
      - libavformat-dev
      - libdfm6-mount-dev
      - libffmpegthumbnailer-dev
    depends:
      - libdfm6-mount
      - libffmpegthumbnailer4v5
      - kimageformat6-plugins
